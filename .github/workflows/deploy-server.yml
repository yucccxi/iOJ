name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "judge-protocol/**"
      - "judge-core/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: deploy
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SERVER_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Build and deploy on server
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -se -- '$COMMIT_SHA'" <<'REMOTE'
          set -euo pipefail
          COMMIT_SHA="$1"

          SOURCE_DIR=/home/deploy/ioj-source
          DEPLOY_DIR=/home/deploy/oj-backend
          JAR_NAME=server-0.0.1-SNAPSHOT.jar

          # 防止服务器上同时执行多次部署
          exec 9>/home/deploy/ioj-build.lock
          flock -n 9

          # 获取本次工作流对应的代码版本
          cd "$SOURCE_DIR"
          git fetch origin main
          git checkout --detach "$COMMIT_SHA"

          # 从仓库根目录构建 server 及其依赖模块：
          # judge-protocol、judge-core，否则 server 单独构建时找不到 SNAPSHOT。
          if [ -x ./mvnw ]; then
            MVN=./mvnw
          else
            MVN=mvn
          fi
          "$MVN" -B -pl server -am clean verify

          # 构建成功后才替换运行文件
          test -f "server/target/$JAR_NAME"
          cp "server/target/$JAR_NAME" "$DEPLOY_DIR/$JAR_NAME.next"
          mv -f "$DEPLOY_DIR/$JAR_NAME.next" "$DEPLOY_DIR/$JAR_NAME"

          # 重启并检查同一个服务
          sudo -n /usr/bin/systemctl restart ioj.service
          /usr/bin/systemctl is-active --quiet ioj.service
          REMOTE

      - name: Remove SSH private key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
