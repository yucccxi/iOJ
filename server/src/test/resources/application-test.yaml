spring:
  datasource:
# Each Spring context gets its own in-memory H2 database so schema.sql can run repeatedly.
    url: jdbc:h2:mem:ioj-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

ioj:
  jwt:
    secret: ioj-test-secret-key-at-least-32-bytes-long
  judge:
# Integration tests call JudgeService directly instead of relying on the scheduled worker.
    enabled: false
    engine: local
    compile-timeout-ms: 60000
    poll-interval-ms: 200

logging:
  level:
    root: warn
    me.iynotuo.judge: info
