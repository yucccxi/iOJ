spring:
  datasource:
# Each Spring context gets its own in-memory H2 database so schema.sql can run repeatedly.
    url: jdbc:h2:mem:ioj-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
# The JavaMailSender bean needs a host; test classes capture codes through a fake sender instead of
# talking to a server, so this value is never connected to.
  mail:
    host: localhost

ioj:
  jwt:
    secret: ioj-test-secret-key-at-least-32-bytes-long
  problem:
# Problem tests assert that an uploaded problem is published immediately, so the behaviour is pinned
# here instead of inheriting whatever the local application.yaml happens to configure.
    auto-publish: true
  email-code:
# Most integration tests only need an account, so registration does not ask for a code here.
# EmailVerificationIntegrationTest switches it back on for its own Spring context.
    enabled: false
  captcha:
# Existing flow tests do not need to solve images; CaptchaIntegrationTest turns this back on.
    enabled: false
  judge:
# Integration tests call JudgeService directly instead of relying on the scheduled worker.
    enabled: false
    engine: local
    compile-timeout-ms: 60000
    poll-interval-ms: 200

logging:
  level:
    root: warn
    me.iynotuo.judge: info
