server:
  port: 8080
  shutdown: graceful
# Trust X-Forwarded-* only when the app sits behind the project's reverse proxy. Used by the
# per-IP CAPTCHA issuance limit; do not expose the app directly to the internet with this on.
  forward-headers-strategy: framework

spring:
  application:
    name: ioj-server
  datasource:
    url: jdbc:mysql://${IOJ_DB_HOST:127.0.0.1}:${IOJ_DB_PORT:3306}/${IOJ_DB_NAME:ioj}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${IOJ_DB_USER:ioj}
    password: ${IOJ_DB_PASSWORD:ioj}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  mail:
# Registration verification mails. The default host does not resolve on purpose: a local run keeps
# working, and a missing IOJ_MAIL_HOST shows up as a clear send failure instead of a silent connect.
    host: ${IOJ_MAIL_HOST:smtp.localhost.invalid}
    port: ${IOJ_MAIL_PORT:25}
    username: ${IOJ_MAIL_USERNAME:}
    password: ${IOJ_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${IOJ_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${IOJ_MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${IOJ_MAIL_SSL:false}
# Bounded timeouts: the mail is sent on the request thread, so a hung SMTP server must not pin it.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

ioj:
  jwt:
# Always override this with an environment variable in production; at least 32 bytes.
    secret: ${IOJ_JWT_SECRET:ioj-development-secret-key-please-change-me}
    expiration: 7d
    issuer: iOJ
  cors:
    allowed-origins: ${IOJ_CORS_ORIGINS:http://localhost:5173}
  problem:
# Club use: true publishes uploaded problems immediately; set it to false to require review when registration is public.
    auto-publish: ${IOJ_PROBLEM_AUTO_PUBLISH:true}
    max-testcases: ${IOJ_PROBLEM_MAX_TESTCASES:100}
# Single test case input or output, in UTF-8 bytes. Override per deployment instead of editing this file.
    max-testcase-bytes: ${IOJ_PROBLEM_MAX_TESTCASE_BYTES:4194304}
  submission:
# Maximum source length per submission, in characters.
    max-code-length: ${IOJ_SUBMISSION_MAX_CODE_LENGTH:65536}
  captcha:
# Image CAPTCHA required by login and the two verification-code mail endpoints.
    enabled: ${IOJ_CAPTCHA_ENABLED:true}
    ttl-seconds: ${IOJ_CAPTCHA_TTL_SECONDS:120}
    max-attempts: ${IOJ_CAPTCHA_MAX_ATTEMPTS:3}
    code-length: ${IOJ_CAPTCHA_CODE_LENGTH:5}
# Per-IP issuance limits; raise these if many users share one campus NAT address.
    issue-per-minute-per-ip: ${IOJ_CAPTCHA_ISSUE_PER_MINUTE_PER_IP:60}
    issue-per-hour-per-ip: ${IOJ_CAPTCHA_ISSUE_PER_HOUR_PER_IP:600}
    cleanup-retention-hours: ${IOJ_CAPTCHA_CLEANUP_RETENTION_HOURS:24}
  email-code:
# Registration requires a code mailed to the address. Set to false to allow registration without one;
# the send endpoint then reports that the feature is off.
    enabled: ${IOJ_EMAIL_CODE_ENABLED:true}
# How long an issued code stays valid.
    ttl-minutes: ${IOJ_EMAIL_CODE_TTL_MINUTES:10}
# Minimum gap between two codes for the same address.
    resend-interval-seconds: ${IOJ_EMAIL_CODE_RESEND_INTERVAL_SECONDS:60}
# Codes per address per hour.
    max-per-hour: ${IOJ_EMAIL_CODE_MAX_PER_HOUR:5}
# Wrong submissions a code tolerates; the failure that reaches this limit invalidates the code.
    max-attempts: ${IOJ_EMAIL_CODE_MAX_ATTEMPTS:5}
# Must be an address the SMTP account is allowed to send as.
    from: ${IOJ_MAIL_FROM:no-reply@localhost}
    subject: ${IOJ_EMAIL_CODE_SUBJECT:iOJ 邮箱验证码}
# Consumed and expired rows are deleted after this many hours.
    cleanup-retention-hours: 24
  judge:
    enabled: ${IOJ_JUDGE_ENABLED:true}
    engine: ${IOJ_JUDGE_ENGINE:isolate}
    concurrency: ${IOJ_JUDGE_CONCURRENCY:1}
    poll-interval-ms: 1000
    max-output-bytes: 16777216
    max-compile-output-bytes: 65536
    compile-timeout-ms: 30000
    # Custom checker (special judge). Limits are global on purpose: they are intentionally
    # independent from the per-problem limits, because a checker usually needs more memory
    # and never should be reported as a contestant failure when it runs out of limits.
    checker:
      enabled: ${IOJ_JUDGE_CHECKER_ENABLED:true}
      time-limit-ms: ${IOJ_JUDGE_CHECKER_TIME_LIMIT_MS:2000}
      memory-limit-mb: ${IOJ_JUDGE_CHECKER_MEMORY_LIMIT_MB:512}
      compile-timeout-ms: ${IOJ_JUDGE_CHECKER_COMPILE_TIMEOUT_MS:30000}
      compile-memory-mb: ${IOJ_JUDGE_CHECKER_COMPILE_MEMORY_MB:512}
      # The compile command must produce an executable named "checker".
      source-file: checker.cpp
      compile-command: g++ -O2 -std=c++17 -pipe -o checker checker.cpp
      message-limit-bytes: 1024
    isolate:
      binary: /usr/bin/isolate
      # Box 0 is commonly created by root during manual tests; start at 1 so a non-root
      # service user does not collide with root-owned boxes.
      box-id-start: 1
      box-id-count: 8
      check-on-startup: true
      compile-processes: 64
      compile-time-seconds: 10
      compile-wall-time-seconds: 30
      compile-cg-mem-kb: 524288
      compile-fsize-kb: 16384
      wall-time-extra-seconds: 3
      setup-timeout-ms: 10000
      # Read-only host directories the sandbox needs. Debian JDK reads
      # /etc/java-21-openjdk/security/java.security; drop this on distributions
      # where the JDK keeps that file inside the JDK directory.
      extra-dirs:
        - /etc/java-21-openjdk
      resolve-executables: true
    languages:
      JAVA:
        display-name: Java 21
        source-file: Main.java
        compile-command: javac -encoding UTF-8 -d . Main.java
        run-command: java -Xmx{memoryMb}m -Xss64m -XX:+UseSerialGC Main
        run-wrapper: exec {command}
        time-multiplier: 2.0
        isolate-processes: 64
        isolate-memory-extra-mb: 256
      CPP:
        display-name: C++17
        source-file: main.cpp
        compile-command: g++ -O2 -std=c++17 -pipe -o main main.cpp
        run-command: ./main
        run-wrapper: ulimit -v {memoryKb}; ulimit -s 65536; exec {command}
        time-multiplier: 1.0
        isolate-processes: 1
        isolate-memory-extra-mb: 16
      C:
        display-name: C11
        source-file: main.c
        compile-command: gcc -O2 -std=c11 -pipe -o main main.c
        run-command: ./main
        run-wrapper: ulimit -v {memoryKb}; ulimit -s 65536; exec {command}
        time-multiplier: 1.0
        isolate-processes: 1
        isolate-memory-extra-mb: 16
      PYTHON3:
        display-name: Python 3
        source-file: main.py
        run-command: python3 main.py
        run-wrapper: ulimit -v {memoryKb}; exec {command}
        time-multiplier: 3.0
        isolate-processes: 1
        isolate-memory-extra-mb: 64

logging:
  level:
    root: info
    me.iynotuo.judge: info

